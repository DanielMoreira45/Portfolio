name: Deploy to GitHub Pages

on:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - run: npm ci

            - run: npm run build -- --configuration production --base-href /${{ github.event.repository.name }}/

            - name: SPA fallback
              run: cp dist/mon-portfolio/browser/index.html dist/mon-portfolio/browser/404.html

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist/mon-portfolio/browser

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v4
            - id: deployment
              uses: actions/deploy-pages@v4
