<div class="card">
    <a [href]="url">
        <article>
            <figure>
                <img [src]="image.src" [alt]="image.alt">
            </figure>
            <div class="article-preview">
                <h2>{{titre}}</h2>
                <p>{{description}}</p>
            </div>
        </article>
    </a>
</div>
